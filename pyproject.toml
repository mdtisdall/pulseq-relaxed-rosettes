[project]
name = "relaxed-rosettes"
version = "0.1.0"
description = "A relaxed rosette k-space trajectory pulse sequence, written with PyPulseq"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pypulseq"]

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["pypulseq", "pypulseq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
